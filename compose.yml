name: gym-g1

x-some-healthcheck: &standard-healthcheck
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"] # 8000 because healthcheck is performed within the container
    interval: 5m
    start_interval: 1s
    start_period: 30s
    timeout: 5s
    retries: 5

services:
  caddy:
    image: caddy:latest
    container_name: caddy-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - service-network

  web:
    container_name: web
    build: ./web
    ports:
      - "7860:7860"
    environment:
      - PREDICTION_API_URL=http://prediction-api:8000/predict
      - PYTHONUNBUFFERED=1
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      prediction-api:
        condition: service_healthy
    networks:
      - service-network

  keypoints-api:
    container_name: keypoints-api
    build: ./apis/keypoints_api
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
    <<: *standard-healthcheck
    networks:
      - service-network
  
  prediction-api:
    container_name: prediction-api
    build: ./apis/prediction_api
    ports:
      - "8004:8000"
    environment:
      - KEYPOINTS_API_URL=http://keypoints-api:8000/keypoints
    depends_on:
      keypoints-api:
        condition: service_healthy
    <<: *standard-healthcheck
    networks:
      - service-network

networks:
  service-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

